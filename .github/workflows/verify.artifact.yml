on:
  workflow_dispatch:
    inputs: { run_id: { required: true } }
permissions: { contents: read, attestations: read, id-token: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: app-artifact, run-id: "${{ inputs.run_id }}", path: . }
      - run: gh attestation verify app.tar.gz --repo "${{ github.repository }}"
        env: { GH_TOKEN: "${{ github.token }}" }
 
